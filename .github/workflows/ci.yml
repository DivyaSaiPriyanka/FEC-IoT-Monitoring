name: FEC IoT CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fec-production-deployment
  cancel-in-progress: false

jobs:
  # ============================================================
  # CI: Test the Python application
  # ============================================================
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            fog/requirements.txt
            tests/requirements.txt

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r fog/requirements.txt
          pip install -r tests/requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall backend fog sensors tests

      - name: Run unit tests
        run: |
          python -m pytest tests -v

  # ============================================================
  # CI: Build Docker images
  # ============================================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: fec-iot-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build fog-node image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./fog/Dockerfile
          push: false
          tags: fec-iot-fog:${{ github.sha }}
          cache-from: type=gha,scope=fog
          cache-to: type=gha,mode=max,scope=fog

      - name: Validate Docker Compose
        run: |
          docker compose config

  # ============================================================
  # CD: Deploy successful main-branch builds to AWS EC2
  # ============================================================
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs:
      - test
      - docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: http://${{ secrets.EC2_HOST }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure SSH private key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/fec-ec2-key.pem
          chmod 600 ~/.ssh/fec-ec2-key.pem

          ssh-keyscan \
            -p "${EC2_SSH_PORT:-22}" \
            -H "$EC2_HOST" \
            >> ~/.ssh/known_hosts

      - name: Upload release to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
        run: |
          tar \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="backend/venv" \
            --exclude="backend/.env" \
            --exclude="backend/fec_data.db" \
            -czf fec-project-release.tar.gz .

          scp \
            -i ~/.ssh/fec-ec2-key.pem \
            -P "${EC2_SSH_PORT:-22}" \
            fec-project-release.tar.gz \
            "${EC2_USER}@${EC2_HOST}:/tmp/fec-project-release.tar.gz"

      - name: Deploy application on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
        run: |
          ssh \
            -i ~/.ssh/fec-ec2-key.pem \
            -p "${EC2_SSH_PORT:-22}" \
            "${EC2_USER}@${EC2_HOST}" << 'REMOTE_SCRIPT'

          set -euo pipefail

          RELEASE_DIR="/tmp/fec-project-release"
          PROJECT_DIR="/opt/fec_project"
          BACKEND_DIR="${PROJECT_DIR}/backend"

          echo "Preparing release directory..."
          rm -rf "${RELEASE_DIR}"
          mkdir -p "${RELEASE_DIR}"

          tar -xzf /tmp/fec-project-release.tar.gz \
            -C "${RELEASE_DIR}"

          echo "Installing rsync if required..."
          if ! command -v rsync >/dev/null 2>&1; then
            sudo dnf install -y rsync
          fi

          echo "Creating application directory..."
          sudo mkdir -p "${PROJECT_DIR}"
          sudo chown -R ec2-user:ec2-user "${PROJECT_DIR}"

          echo "Synchronising application files..."
          rsync -av --delete \
            --exclude="backend/.env" \
            --exclude="backend/venv/" \
            --exclude="backend/fec_data.db" \
            "${RELEASE_DIR}/" \
            "${PROJECT_DIR}/"

          cd "${PROJECT_DIR}"

          # First deployment
          if [ ! -d "${BACKEND_DIR}/venv" ]; then
            echo "Running initial EC2 provisioning..."
            sudo bash deployment/deploy_ec2.sh

          # Later deployments
          else
            echo "Updating Python dependencies..."
            source "${BACKEND_DIR}/venv/bin/activate"
            python -m pip install --upgrade pip
            pip install -r "${BACKEND_DIR}/requirements.txt"
            deactivate

            echo "Refreshing service definitions..."
            sudo cp deployment/fec-web.service \
              /etc/systemd/system/fec-web.service

            sudo cp deployment/fec-worker@.service \
              /etc/systemd/system/fec-worker@.service

            sudo cp deployment/nginx_fec.conf \
              /etc/nginx/conf.d/fec.conf

            sudo systemctl daemon-reload

            echo "Restarting application services..."
            sudo systemctl restart redis6
            sudo systemctl restart fec-web.service
            sudo systemctl restart fec-worker@1.service

            sudo nginx -t
            sudo systemctl reload nginx
          fi

          echo "Waiting for application startup..."
          sleep 8

          echo "Checking service status..."
          sudo systemctl is-active --quiet fec-web.service
          sudo systemctl is-active --quiet fec-worker@1.service
          sudo systemctl is-active --quiet nginx

          echo "Checking application health..."
          curl --fail --retry 6 --retry-delay 5 \
            http://127.0.0.1/healthz

          echo "Deployment completed successfully."

          rm -rf "${RELEASE_DIR}"
          rm -f /tmp/fec-project-release.tar.gz

          REMOTE_SCRIPT

      - name: Verify public website
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl --fail \
            --retry 6 \
            --retry-delay 5 \
            "http://${EC2_HOST}/healthz"

      - name: Remove SSH key
        if: always()
        run: |
          rm -f ~/.ssh/fec-ec2-key.pem