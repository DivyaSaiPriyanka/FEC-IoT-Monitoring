# /etc/nginx/conf.d/fec.conf
#
# Reverse proxy: nginx (port 80) -> gunicorn (127.0.0.1:8000)
#
# Rationale: nginx handles TLS termination (via certbot/ACM+ALB in a
# multi-instance setup), static file caching, and buffers slow
# clients so gunicorn worker threads are freed up quickly -- important
# for keeping the ingestion endpoint responsive under load.

upstream fec_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    location /static/ {
        alias /opt/fec_project/backend/static/;
        expires 1h;
        access_log off;
    }

    location /healthz {
        proxy_pass http://fec_backend;
        access_log off;
    }

    location / {
        proxy_pass http://fec_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
